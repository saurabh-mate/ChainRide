name: ChainRide Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./chain-ride/backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/chainride-backend:latest

    - name: Build and Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./chain-ride/frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/chainride-frontend:latest

    - name: Deploy to K3s Cluster via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.CLUSTER_IP }}
        username: ${{ secrets.CLUSTER_USER }}
        key: ${{ secrets.CLUSTER_SSH_KEY }}
        script: |
          cd ~     
          export KUBECONFIG=$HOME/k3s.yaml  

          if [ ! -d "ChainRide" ]; then
            git clone https://github.com/saurabh-mate/ChainRide.git
          fi
          
          cd ChainRide
          git reset --hard HEAD
          git pull origin main

          kubectl apply -f chain-ride/k3s-files/cluster-issuer.yaml --validate=false || true
          kubectl apply -f chain-ride/k3s-files/chainride.yaml

          kubectl rollout restart deployment/chainride-backend -n chainride
          kubectl rollout restart deployment/chainride-frontend -n chainride  

          kubectl rollout status deployment/chainride-backend -n chainride --timeout=60s
          kubectl rollout status deployment/chainride-frontend -n chainride --timeout=60s