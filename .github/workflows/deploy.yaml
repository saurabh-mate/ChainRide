name: ChainRide Production CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend
      uses: docker/build-push-action@v5
      with:
        context: ./chain-ride/backend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/chainride-backend:latest

    - name: Build and Push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./chain-ride/frontend
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/chainride-frontend:latest

    - name: Deploy to K3s Cluster via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.CLUSTER_IP }}
        username: ${{ secrets.CLUSTER_USER }}
        key: ${{ secrets.CLUSTER_SSH_KEY }}
        script: |
          cd ~         
          kubectl apply -f cluster-issuer.yaml --validate=false || true
          kubectl apply -f chainride.yaml
          kubectl rollout restart deployment/backend-deployment
          kubectl rollout restart deployment/frontend-deployment          
          kubectl rollout status deployment/backend-deployment --timeout=60s
          kubectl rollout status deployment/frontend-deployment --timeout=60s