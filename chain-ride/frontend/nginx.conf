server {
    listen 80;
    server_name localhost;

    # 1. Frontend: Serve Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # This directive is critical for React Router. 
        # It redirects 404s back to index.html so React can handle the route.
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend: Proxy API Requests
    # This matches any request starting with /api/ and sends it to the backend container
    location /api/ {
        proxy_pass http://chainride-backend:5000; # Use the service name from docker-compose
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. WebSockets: Required for Socket.io
    location /socket.io/ {
        proxy_pass http://chainride-backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Custom Error Page (Optional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}